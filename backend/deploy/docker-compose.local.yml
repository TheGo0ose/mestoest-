services:
  db:
    ports:
      - "127.0.0.1:5432:5432"

  api:
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: local
      APP_SEED_ENABLED: "true"

  web:
    ports:
      - "127.0.0.1:3000:3000"

  mock:
    profiles: ["mock"]
    image: stoplight/prism:5
    container_name: tablemint-mock
    ports:
      - "127.0.0.1:4010:4010"
    volumes:
      - ../contract/openapi.yaml:/openapi.yaml:ro
    command: "mock -h 0.0.0.0 /openapi.yaml"

services:
  db:
    image: postgres:16-alpine
    container_name: tablemint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tablemint}
      POSTGRES_USER: ${POSTGRES_USER:-tablemint}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tablemint}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tablemint} -d ${POSTGRES_DB:-tablemint}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tablemint-net

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    container_name: tablemint-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-tablemint}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-tablemint}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-tablemint}
      APP_BOT_SERVICE_TOKEN: ${APP_BOT_SERVICE_TOKEN}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      SEED_PASSWORD: ${SEED_PASSWORD:-Password123!}
      JAVA_TOOL_OPTIONS: ${API_JAVA_TOOL_OPTIONS:--Xmx768m}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - tablemint-net

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    container_name: tablemint-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - tablemint-net

  bot:
    profiles: ["bot"]
    build:
      context: ../bot
      dockerfile: Dockerfile
    container_name: tablemint-bot
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      APP_API_BASE_URL: http://api:8080/api/v1
      APP_BOT_SERVICE_TOKEN: ${APP_BOT_SERVICE_TOKEN}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      JAVA_TOOL_OPTIONS: ${BOT_JAVA_TOOL_OPTIONS:--Xmx256m}
    networks:
      - tablemint-net

  caddy:
    image: caddy:2-alpine
    container_name: tablemint-caddy
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - tablemint-net

networks:
  tablemint-net:
    driver: bridge

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

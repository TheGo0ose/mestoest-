server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: tablemint-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tablemint}
    username: ${SPRING_DATASOURCE_USERNAME:tablemint}
    password: ${SPRING_DATASOURCE_PASSWORD:tablemint}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  session:
    store-type: jdbc
    jdbc:
      initialize-schema: always
      table-name: SPRING_SESSION
    timeout: 7200s # 2 hours idle timeout

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

app:
  bot-service-token: ${APP_BOT_SERVICE_TOKEN:test-bot-token-secret-must-be-min-32-chars-long}
  default-locale: ${APP_DEFAULT_LOCALE:ru}
  seed-enabled: ${APP_SEED_ENABLED:false}
  seed-password: ${SEED_PASSWORD:Password123!}
  timezone: Asia/Bishkek

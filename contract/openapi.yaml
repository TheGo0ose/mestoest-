openapi: 3.0.3
info:
  title: TableMint API
  description: Контракт между Backend, Frontend и Telegram-ботом TableMint
  version: 0.1.0
servers:
  - url: /api/v1
    description: Base API path

tags:
  - name: Auth
  - name: Catalog
  - name: Bookings
  - name: GuestBookings
  - name: AdminRestaurants
  - name: AdminTables
  - name: AdminMenu
  - name: AdminContactRequests
  - name: AdminStats
  - name: AdminUsers

paths:
  /auth/register:
    post:
      tags: [Auth]
      operationId: registerCustomer
      summary: Регистрация нового клиента
      x-access: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCustomerRequest'
      responses:
        '201':
          description: Аккаунт создан, сессия установлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/EmailAlreadyRegisteredError'
        '422':
          $ref: '#/components/responses/ConsentRequiredError'

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Вход в систему
      x-access: [ANONYMOUS]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/InvalidCredentialsError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Выход из системы
      x-access: [CUSTOMER, OWNER, MODERATOR]
      responses:
        '204':
          description: Сессия завершена
        '401':
          $ref: '#/components/responses/UnauthenticatedError'

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Получение данных текущего пользователя
      x-access: [CUSTOMER, OWNER, MODERATOR]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'

  /auth/password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: Смена пароля (в т.ч. принудительная для владельцев)
      x-access: [CUSTOMER, OWNER, MODERATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Пароль успешно изменен
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '422':
          $ref: '#/components/responses/CurrentPasswordInvalidError'

  /restaurants:
    get:
      tags: [Catalog]
      operationId: listRestaurants
      summary: Список опубликованных ресторанов
      x-access: [ANONYMOUS, CUSTOMER, OWNER, MODERATOR, BOT]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantPageDto'

  /restaurants/{restaurantId}:
    get:
      tags: [Catalog]
      operationId: getRestaurant
      summary: Карточка опубликованного ресторана
      x-access: [ANONYMOUS, CUSTOMER, OWNER, MODERATOR, BOT]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestaurantDetailDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /restaurants/{restaurantId}/menu:
    get:
      tags: [Catalog]
      operationId: getMenu
      summary: Публичное меню ресторана
      x-access: [ANONYMOUS, CUSTOMER, OWNER, MODERATOR, BOT]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenuDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /restaurants/{restaurantId}/availability:
    get:
      tags: [Catalog]
      operationId: getAvailability
      summary: Доступные слоты для бронирования
      x-access: [ANONYMOUS, CUSTOMER, OWNER, MODERATOR, BOT]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: partySize
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvailabilityDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/BookingRuleError'

  /restaurants/{restaurantId}/contact-requests:
    post:
      tags: [Catalog]
      operationId: createContactRequest
      summary: Отправка запроса на обратную связь
      x-access: [ANONYMOUS, CUSTOMER, OWNER, MODERATOR, BOT]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequestBody'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequestDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '422':
          $ref: '#/components/responses/ConsentRequiredError'
        '429':
          $ref: '#/components/responses/RateLimitedError'

  /bookings:
    post:
      tags: [Bookings]
      operationId: createBooking
      summary: Создание бронирования зарегистрированным клиентом
      x-access: [CUSTOMER]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBookingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'
        '409':
          $ref: '#/components/responses/BookingNoAvailabilityError'
        '422':
          $ref: '#/components/responses/BookingRuleError'

  /me/bookings:
    get:
      tags: [Bookings]
      operationId: listMyBookings
      summary: Список бронирований текущего клиента
      x-access: [CUSTOMER]
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPageDto'
        '401':
          $ref: '#/components/responses/UnauthenticatedError'

  /bookings/{bookingId}:
    get:
      tags: [Bookings]
      operationId: getBooking
      summary: Получение деталей бронирования
      x-access: [CUSTOMER, OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /bookings/{bookingId}/cancel:
    post:
      tags: [Bookings]
      operationId: cancelBooking
      summary: Отмена бронирования
      x-access: [CUSTOMER, OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/BookingIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/BookingNotModifiableError'

  /bookings/{bookingId}/reschedule:
    post:
      tags: [Bookings]
      operationId: rescheduleBooking
      summary: Перенос бронирования на другое время
      x-access: [CUSTOMER, OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/BookingIdPath'
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RescheduleBookingRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '409':
          $ref: '#/components/responses/BookingNoAvailabilityError'
        '422':
          $ref: '#/components/responses/BookingRuleError'

  /guest/bookings:
    post:
      tags: [GuestBookings]
      operationId: createGuestBooking
      summary: Создание бронирования ботом для гостя Telegram
      x-access: [BOT]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGuestBookingRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDto'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '409':
          $ref: '#/components/responses/BookingNoAvailabilityError'
        '422':
          $ref: '#/components/responses/BookingRuleError'

  /admin/restaurants:
    get:
      tags: [AdminRestaurants]
      operationId: listManagedRestaurants
      summary: Рестораны под управлением текущего владельца / модератора
      x-access: [OWNER, MODERATOR]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ManagedRestaurantDto'
    post:
      tags: [AdminRestaurants]
      operationId: createRestaurant
      summary: Создание каркаса нового ресторана
      x-access: [MODERATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedRestaurantDto'

  /admin/restaurants/{restaurantId}:
    get:
      tags: [AdminRestaurants]
      operationId: getManagedRestaurant
      summary: Данные ресторана в админ-панели
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedRestaurantDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
    patch:
      tags: [AdminRestaurants]
      operationId: updateRestaurant
      summary: Обновление информации о ресторане
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedRestaurantDto'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /admin/restaurants/{restaurantId}/publication:
    put:
      tags: [AdminRestaurants]
      operationId: setPublication
      summary: Публикация или снятие ресторана с публикации
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [PUBLISHED, HIDDEN]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedRestaurantDto'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/RestaurantNotReadyError'

  /admin/restaurants/{restaurantId}/opening-hours:
    put:
      tags: [AdminRestaurants]
      operationId: replaceOpeningHours
      summary: Установка часов работы на все дни
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/OpeningHoursDto'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OpeningHoursDto'

  /admin/restaurants/{restaurantId}/tables:
    get:
      tags: [AdminTables]
      operationId: listTables
      summary: Список столиков ресторана
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DiningTableDto'
    post:
      tags: [AdminTables]
      operationId: createTable
      summary: Создание столика
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTableRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiningTableDto'

  /admin/tables/{tableId}:
    patch:
      tags: [AdminTables]
      operationId: updateTable
      summary: Обновление параметров столика
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/TableIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTableRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiningTableDto'
        '409':
          $ref: '#/components/responses/TableInUseError'
    delete:
      tags: [AdminTables]
      operationId: deleteTable
      summary: Удаление столика
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/TableIdPath'
      responses:
        '204':
          description: Столик удален
        '409':
          $ref: '#/components/responses/TableInUseError'

  /admin/restaurants/{restaurantId}/menu:
    get:
      tags: [AdminMenu]
      operationId: getManagedMenu
      summary: Полное меню ресторана для управления
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedMenuDto'

  /admin/restaurants/{restaurantId}/menu-sections:
    post:
      tags: [AdminMenu]
      operationId: createMenuSection
      summary: Создание раздела меню
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuSectionRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuSectionDto'

  /admin/menu-sections/{sectionId}:
    patch:
      tags: [AdminMenu]
      operationId: updateMenuSection
      summary: Обновление названия/порядка раздела меню
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/SectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuSectionRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuSectionDto'
    delete:
      tags: [AdminMenu]
      operationId: deleteMenuSection
      summary: Удаление раздела меню со всеми блюдами
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/SectionIdPath'
      responses:
        '204':
          description: Раздел удален

  /admin/menu-sections/{sectionId}/items:
    post:
      tags: [AdminMenu]
      operationId: createMenuItem
      summary: Добавление позиции меню в раздел
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/SectionIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'

  /admin/menu-items/{itemId}:
    patch:
      tags: [AdminMenu]
      operationId: updateMenuItem
      summary: Обновление позиции меню (цена, доступность)
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuItemDto'
    delete:
      tags: [AdminMenu]
      operationId: deleteMenuItem
      summary: Удаление позиции меню
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/ItemIdPath'
      responses:
        '204':
          description: Позиция меню удалена

  /admin/restaurants/{restaurantId}/bookings:
    get:
      tags: [AdminRestaurants]
      operationId: listRestaurantBookings
      summary: Бронирования ресторана за выбранный диапазон дат
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/RestaurantIdPath'
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RestaurantBookingDto'

  /admin/contact-requests:
    get:
      tags: [AdminContactRequests]
      operationId: listContactRequests
      summary: Запросы на связь для управляемых ресторанов
      x-access: [OWNER, MODERATOR]
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactRequestDto'

  /admin/contact-requests/{contactRequestId}:
    patch:
      tags: [AdminContactRequests]
      operationId: updateContactRequest
      summary: Смена статуса запроса (NEW -> HANDLED)
      x-access: [OWNER, MODERATOR]
      parameters:
        - $ref: '#/components/parameters/ContactRequestIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [NEW, HANDLED]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactRequestDto'

  /admin/stats/bookings:
    get:
      tags: [AdminStats]
      operationId: getBookingStats
      summary: Аналитика бронирований для StatsDashboard
      x-access: [OWNER, MODERATOR]
      parameters:
        - name: restaurantId
          in: query
          schema:
            type: string
            format: uuid
        - name: fromDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingStatsDto'

  /admin/users:
    get:
      tags: [AdminUsers]
      operationId: listUsers
      summary: Список пользователей платформы (только модератор)
      x-access: [MODERATOR]
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: role
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageDto'

  /admin/owners:
    post:
      tags: [AdminUsers]
      operationId: createOwner
      summary: Создание аккаунта владельца с временным паролем
      x-access: [MODERATOR]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOwnerRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateOwnerResponse'

  /admin/users/{userId}:
    patch:
      tags: [AdminUsers]
      operationId: updateUser
      summary: Изменение статуса пользователя (ACTIVE / DISABLED)
      x-access: [MODERATOR]
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ACTIVE, DISABLED]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

components:
  parameters:
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 0
    SizeQuery:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        maximum: 100
    RestaurantIdPath:
      name: restaurantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TableIdPath:
      name: tableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SectionIdPath:
      name: sectionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemIdPath:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingIdPath:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContactRequestIdPath:
      name: contactRequestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: Ошибка валидации полей
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    UnauthenticatedError:
      description: Пользователь не авторизован
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ForbiddenError:
      description: Доступ запрещен для роли
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    NotFoundError:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidCredentialsError:
      description: Неверные учетные данные
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    EmailAlreadyRegisteredError:
      description: Email уже занят
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ConsentRequiredError:
      description: Требуется согласие на обработку данных
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    CurrentPasswordInvalidError:
      description: Неверный текущий пароль
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    RateLimitedError:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BookingNoAvailabilityError:
      description: Нет свободных столиков на выбранное время
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BookingNotModifiableError:
      description: Бронирование нельзя изменить или отменить
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    BookingRuleError:
      description: Нарушение бизнес-правила бронирования
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    RestaurantNotReadyError:
      description: Ресторан не готов к публикации
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    TableInUseError:
      description: Столик занят будущими бронированиями
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'

  schemas:
    ProblemDetail:
      type: object
      required: [type, status, code, title]
      properties:
        type:
          type: string
          example: "about:blank"
        status:
          type: integer
          example: 409
        code:
          type: string
          example: "BOOKING_NO_AVAILABILITY"
        title:
          type: string
          example: "На это время нет свободных столиков. Выберите другое время."
        detail:
          type: string
        fieldErrors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
              message:
                type: string

    UserDto:
      type: object
      required: [id, email, displayName, role, locale, status, mustChangePassword]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, OWNER, MODERATOR]
        locale:
          type: string
        status:
          type: string
          enum: [ACTIVE, DISABLED]
        mustChangePassword:
          type: boolean

    RegisterCustomerRequest:
      type: object
      required: [email, password, displayName, consentAccepted, consentVersion]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
        displayName:
          type: string
        phone:
          type: string
        consentAccepted:
          type: boolean
        consentVersion:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 10

    RestaurantDetailDto:
      type: object
      required: [id, name, address, phone, timeZone, sittingMinutes, slotMinutes]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        address:
          type: string
        phone:
          type: string
        timeZone:
          type: string
        sittingMinutes:
          type: integer
        slotMinutes:
          type: integer
        openingHours:
          type: array
          items:
            $ref: '#/components/schemas/OpeningHoursDto'

    ManagedRestaurantDto:
      allOf:
        - $ref: '#/components/schemas/RestaurantDetailDto'
        - type: object
          required: [ownerId, status, minLeadMinutes, maxAdvanceDays]
          properties:
            ownerId:
              type: string
              format: uuid
            status:
              type: string
              enum: [DRAFT, PUBLISHED, HIDDEN]
            minLeadMinutes:
              type: integer
            maxAdvanceDays:
              type: integer

    OpeningHoursDto:
      type: object
      required: [dayOfWeek, opensAt, closesAt]
      properties:
        dayOfWeek:
          type: integer
          minimum: 1
          maximum: 7
        opensAt:
          type: string
          example: "12:00:00"
        closesAt:
          type: string
          example: "23:00:00"

    DiningTableDto:
      type: object
      required: [id, label, seats, active]
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        seats:
          type: integer
          minimum: 1
          maximum: 50
        active:
          type: boolean

    PublicMenuDto:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuSectionDto'

    PublicMenuSectionDto:
      type: object
      required: [id, name, items]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/PublicMenuItemDto'

    PublicMenuItemDto:
      type: object
      required: [id, name, priceAmount, currency]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: string
          example: "1250.00"
        currency:
          type: string
          example: "KGS"

    AvailabilityDto:
      type: object
      required: [date, partySize, slots]
      properties:
        date:
          type: string
          format: date
        partySize:
          type: integer
        slots:
          type: array
          items:
            type: string
            format: date-time
            example: "2026-10-20T19:00:00+06:00"

    CreateBookingRequest:
      type: object
      required: [restaurantId, startsAt, partySize, consentAccepted, consentVersion]
      properties:
        restaurantId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        partySize:
          type: integer
          minimum: 1
        consentAccepted:
          type: boolean
        consentVersion:
          type: string

    CreateGuestBookingRequest:
      type: object
      required: [restaurantId, startsAt, partySize, guestName, guestPhone, telegramUserId, consentAccepted, consentVersion]
      properties:
        restaurantId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        partySize:
          type: integer
          minimum: 1
        guestName:
          type: string
        guestPhone:
          type: string
        telegramUserId:
          type: integer
          format: int64
        consentAccepted:
          type: boolean
        consentVersion:
          type: string

    RescheduleBookingRequest:
      type: object
      required: [startsAt]
      properties:
        startsAt:
          type: string
          format: date-time

    BookingDto:
      type: object
      required: [id, reference, restaurantId, tableId, tableLabel, partySize, startsAt, endsAt, status, source, createdAt]
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
          example: "TM-7K3Q9P"
        restaurantId:
          type: string
          format: uuid
        tableId:
          type: string
          format: uuid
        tableLabel:
          type: string
        partySize:
          type: integer
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        status:
          type: string
          enum: [CONFIRMED, CANCELLED]
        source:
          type: string
          enum: [WEB, TELEGRAM]
        guestName:
          type: string
        guestPhone:
          type: string
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time

    RestaurantBookingDto:
      allOf:
        - $ref: '#/components/schemas/BookingDto'
        - type: object
          properties:
            customerEmail:
              type: string

    CreateContactRequestBody:
      type: object
      required: [name, message, consentAccepted, consentVersion]
      properties:
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        message:
          type: string
        consentAccepted:
          type: boolean
        consentVersion:
          type: string

    ContactRequestDto:
      type: object
      required: [id, restaurantId, name, message, source, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        message:
          type: string
        source:
          type: string
          enum: [WEB, TELEGRAM]
        status:
          type: string
          enum: [NEW, HANDLED]
        createdAt:
          type: string
          format: date-time
        handledAt:
          type: string
          format: date-time

    BookingStatsDto:
      type: object
      required: [totalBookings, totalCovers, cancelledBookings, cancellationRate, webBookings, telegramBookings, dailySeries]
      properties:
        totalBookings:
          type: integer
        totalCovers:
          type: integer
        cancelledBookings:
          type: integer
        cancellationRate:
          type: number
        webBookings:
          type: integer
        telegramBookings:
          type: integer
        dailySeries:
          type: array
          items:
            type: object
            required: [date, bookings, covers]
            properties:
              date:
                type: string
                format: date
              bookings:
                type: integer
              covers:
                type: integer

    CreateRestaurantRequest:
      type: object
      required: [ownerId, name, address, phone]
      properties:
        ownerId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        address:
          type: string
        phone:
          type: string

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        address:
          type: string
        phone:
          type: string
        sittingMinutes:
          type: integer
        slotMinutes:
          type: integer
        minLeadMinutes:
          type: integer
        maxAdvanceDays:
          type: integer

    CreateTableRequest:
      type: object
      required: [label, seats]
      properties:
        label:
          type: string
        seats:
          type: integer
          minimum: 1
          maximum: 50
        active:
          type: boolean
          default: true

    UpdateTableRequest:
      type: object
      properties:
        label:
          type: string
        seats:
          type: integer
          minimum: 1
          maximum: 50
        active:
          type: boolean

    CreateOwnerRequest:
      type: object
      required: [email, displayName]
      properties:
        email:
          type: string
          format: email
        displayName:
          type: string
        phone:
          type: string

    CreateOwnerResponse:
      type: object
      required: [user, temporaryPassword]
      properties:
        user:
          $ref: '#/components/schemas/UserDto'
        temporaryPassword:
          type: string

    ManagedMenuDto:
      type: object
      required: [sections]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/MenuSectionWithItemsDto'

    MenuSectionDto:
      type: object
      required: [id, restaurantId, name, position]
      properties:
        id:
          type: string
          format: uuid
        restaurantId:
          type: string
          format: uuid
        name:
          type: string
        position:
          type: integer

    MenuSectionWithItemsDto:
      allOf:
        - $ref: '#/components/schemas/MenuSectionDto'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MenuItemDto'

    MenuItemDto:
      type: object
      required: [id, sectionId, name, priceAmount, currency, available, position]
      properties:
        id:
          type: string
          format: uuid
        sectionId:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: string
        currency:
          type: string
        available:
          type: boolean
        position:
          type: integer

    CreateMenuSectionRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        position:
          type: integer

    UpdateMenuSectionRequest:
      type: object
      properties:
        name:
          type: string
        position:
          type: integer

    CreateMenuItemRequest:
      type: object
      required: [name, priceAmount]
      properties:
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: string
        available:
          type: boolean
          default: true
        position:
          type: integer

    UpdateMenuItemRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        priceAmount:
          type: string
        available:
          type: boolean
        position:
          type: integer

    RestaurantPageDto:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RestaurantDetailDto'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer

    BookingPageDto:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BookingDto'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer

    UserPageDto:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserDto'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
